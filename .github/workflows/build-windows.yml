name: Build DupliFile for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "duplifile.ico"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DupliFile --icon duplifile.ico app.py

      - name: Upload DupliFile.exe
        uses: actions/upload-artifact@v4
        with:
          name: DupliFile-Windows
          path: dist/DupliFile.exe
          if-no-files-found: error
